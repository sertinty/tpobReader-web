<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TPOB 阅读器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <button id="btn-back" class="icon-btn hidden" title="返回">
    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
  </button>
  <h1 id="header-title">书架</h1>
  <div id="theme-btn-wrap"><theme-button id="btn-theme" value="light" size="1.2"></theme-button></div>
</header>

<main id="view-library">
  <div id="books-grid" class="books-grid"></div>
  <div id="empty-hint" class="empty-hint hidden">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor" opacity="0.5">
      <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/>
    </svg>
    <p>书架上还没有书</p>
    <p class="sub">点击右下角按钮导入</p>
  </div>
  <button id="btn-import" class="fab" title="导入书籍">
    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
  </button>
  <input type="file" id="file-input" accept=".tpob,.zip" hidden>
</main>

<main id="view-reader" class="hidden">
  <div id="reader-content" class="reader-content"></div>
</main>

<div id="loading" class="loading hidden">
  <div class="spinner"></div>
  <p id="loading-text">正在导入...</p>
</div>

<div id="dialog" class="dialog-overlay hidden">
  <div class="dialog-box">
    <h3 id="dialog-title"></h3>
    <p id="dialog-text"></p>
    <div class="dialog-actions">
      <button id="dialog-cancel" class="btn">取消</button>
      <button id="dialog-confirm" class="btn btn-danger">删除</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="theme-button.js"></script>
<script src="app.js"></script>
</body>
</html>
